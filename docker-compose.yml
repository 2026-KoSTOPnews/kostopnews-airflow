x-airflow-common: &airflow-common
  build: .
  image: boyeongg/kostopnews-airflow:latest
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow 메타데이터 DB
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_POSTGRES_HOST}:${AIRFLOW_DB_POSTGRES_PORT}/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # 동시 실행 제한
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    # DB Pool 제한
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "3"
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"

  volumes:
    - ./dags:/opt/airflow/dags

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: >
      bash -c "
      airflow db migrate &&
      (airflow users create
      --username '${AIRFLOW_ADMIN_USERNAME}'
      --password '${AIRFLOW_ADMIN_PASSWORD}'
      --firstname '${AIRFLOW_ADMIN_FIRSTNAME}'
      --lastname '${AIRFLOW_ADMIN_LASTNAME}'
      --role Admin
      --email '${AIRFLOW_ADMIN_EMAIL}' || true)
      "

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler