name: Airflow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'dags/**'
              - 'requirements.txt'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.local.yml'
              - '.github/workflows/**'
            tests:
              - 'tests/**'
              - 'pytest.ini'
              - 'conftest.py'

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock pendulum

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_PORT: "5432"
          FASTAPI_BASE_URL: http://localhost:8000
        run: python -m pytest

  docker:
    needs: [changes, test]
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kostopnews-airflow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kostopnews-airflow:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/kostopnews-airflow
            git pull origin main
            docker compose pull
            docker compose up -d
            docker image prune -f